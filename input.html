<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Penyetoran KDKMP</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f6fa;
        color: #202124;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .form-card {
        background: white;
        padding: 30px;
        border-radius: 14px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        width: 100%;
        max-width: 480px;
      }

      .form-header {
        text-align: center;
        margin-bottom: 25px;
      }

      .form-header i {
        font-size: 40px;
        color: #7b1e2b;
        margin-bottom: 10px;
      }

      .form-header h2 {
        margin: 0;
        color: #7b1e2b;
        font-size: 22px;
      }

      .form-header p {
        margin: 5px 0 0;
        color: #666;
        font-size: 13px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 18px;
      }

      .form-group label {
        font-size: 13px;
        font-weight: 600;
        color: #444;
      }

      .form-group input,
      .form-group select {
        height: 42px;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 0 12px;
        font-size: 14px;
        outline: none;
        background: white;
      }

      .form-group input:focus,
      .form-group select:focus {
        border-color: #7b1e2b;
      }

      .submit-btn {
        width: 100%;
        height: 45px;
        background: #7b1e2b;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
        transition: background 0.2s;
      }

      .submit-btn:hover {
        background: #601721;
      }

      .submit-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .back-link {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #777;
        text-decoration: none;
        font-size: 13px;
      }

      .back-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="form-card">
      <div class="form-header">
        <i class="fa-solid fa-file-invoice-dollar"></i>
        <h2>Input Transaksi KDKMP</h2>
        <p>Form pelaporan Close Shift & Setor Omset</p>
      </div>

      <form id="salesForm" onsubmit="submitForm(event)">
        <div class="form-group">
          <label>Tanggal Transaksi</label>
          <input type="date" id="tanggal" required />
        </div>

        <!-- OPTIONS KDKMP DIKUNCI SECARA PERMANEN DI SINI -->
        <div class="form-group">
          <label>KDKMP</label>
          <select id="kdkmp" required>
            <option value="">-- Pilih KDKMP --</option>
            <option value="Citaman_Nagreg">Citaman Nagreg</option>
            <option value="Bojongloa_Rancaekek">Bojongloa Rancaekek</option>
            <option value="Sukamaju_Majalaya">Sukamaju Majalaya</option>
          </select>
        </div>

        <div class="form-group">
          <label>Jenis Transaksi / Status</label>
          <select id="status" required>
            <option value="Close Shift">Close Shift</option>
            <option value="Setor Omset">Setor Omset</option>
          </select>
        </div>

        <div class="form-group">
          <label>Nominal (Rp)</label>
          <input
            type="number"
            id="nominal"
            placeholder="Contoh: 500000"
            min="1"
            required
          />
        </div>

        <div class="form-group">
          <label>Bukti Transfer / Close Shift (Wajib)</label>
          <input type="file" id="bukti" accept="image/*" />
        </div>

        <button type="submit" class="submit-btn" id="btnSubmit">
          <i class="fa-solid fa-paper-plane"></i> Kirim Laporan
        </button>
      </form>

      <a href="index.html" class="back-link"
        ><i class="fa-solid fa-arrow-left"></i> Kembali ke Dashboard</a
      >
    </div>

    <script>
      // GANTI DENGAN URL DEPLOYMENT APPS SCRIPT ANDA
      const API_URL =
        "https://script.google.com/macros/s/AKfycbytQnTdl9gEqBUX3dfXdwZoEoES54ntEYIrYQP4s1I9RHYjcmkse9IzUKRj-zW_kBRd1Q/exec";

      // Otomatis isi tanggal hari ini
      document.getElementById("tanggal").valueAsDate = new Date();

      // Submit Form Handler
      function submitForm(event) {
        event.preventDefault();

        const btn = document.getElementById("btnSubmit");
        btn.innerHTML =
          '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';
        btn.disabled = true;

        const fileInput = document.getElementById("bukti");
        const file = fileInput.files[0];

        const payload = {
          tanggal: document.getElementById("tanggal").value,
          kdkmp: document.getElementById("kdkmp").value,
          status: document.getElementById("status").value,
          nominal: document.getElementById("nominal").value,
          fileData: null,
          fileName: null,
        };

        if (file) {
          const reader = new FileReader();
          reader.onload = function (e) {
            payload.fileData = e.target.result;
            payload.fileName = file.name;
            sendData(payload);
          };
          reader.readAsDataURL(file);
        } else {
          sendData(payload);
        }
      }

      function sendData(payload) {
        fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload),
        })
          .then((res) => res.json())
          .then((res) => {
            if (res.success) {
              alert("✅ Data transaksi berhasil disimpan ke Spreadsheet!");
              document.getElementById("salesForm").reset();
              document.getElementById("tanggal").valueAsDate = new Date();
            } else {
              alert(
                "❌ Gagal menyimpan: " + (res.error || "Terjadi kesalahan"),
              );
            }
          })
          .catch((err) => {
            alert("❌ Terjadi kesalahan jaringan / URL API belum terhubung.");
            console.error(err);
          })
          .finally(() => {
            const btn = document.getElementById("btnSubmit");
            btn.innerHTML =
              '<i class="fa-solid fa-paper-plane"></i> Kirim Laporan';
            btn.disabled = false;
          });
      }
    </script>
  </body>
</html>
